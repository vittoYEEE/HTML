<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Modern</title>
    <!-- Link untuk ikon (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset & Styling Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        /* Container Login Card */
        .login-container {
            background: #fff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        /* Judul */
        .login-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
            font-weight: 600;
        }

        /* Grup Input */
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            padding-left: 45px; /* Space untuk icon */
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 42px; /* Sesuaikan posisi icon */
            color: #aaa;
            transition: color 0.3s ease;
        }

        /* Efek saat input aktif atau diisi */
        .input-group input:focus,
        .input-group input:valid {
            border-color: #667eea;
        }

        .input-group input:focus + i,
        .input-group input:valid + i {
            color: #667eea;
        }

        /* Tombol Login */
        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            box-shadow: 0 7px 20px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
        }

        /* Link Lupa Password & Daftar */
        .login-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .login-links a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Responsive untuk mobile */
        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .login-container h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Masuk ke Akun Anda</h2>
        <form id="loginForm">
            <!-- Input Email -->
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
                <i class="fas fa-envelope"></i>
            </div>
            <!-- Input Password -->
            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" required>
                <i class="fas fa-lock"></i>
            </div>
            <!-- Tombol Login -->
            <button type="submit" class="btn-login">Masuk</button>
        </form>
        <!-- Link Lupa Password & Daftar -->
        <div class="login-links">
            <a href="#">Lupa Kata Sandi?</a>
            <a href="#">Daftar Akun Baru</a>
        </div>
    </div>

    <script>
        // JavaScript sederhana untuk menangani form submission
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Mencegah form reload halaman

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Validasi sederhana
            if(email && password) {
                // Biasanya di sini ada request ke server (API)
                alert('Login berhasil! (Ini hanya demo)');
                // window.location.href = "dashboard.html"; // Redirect ke halaman lain
            } else {
                alert('Harap isi email dan password!');
            }
        });
    </script>

</body>
</html>
