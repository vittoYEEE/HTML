<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>animation 2d</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <!--rotate effect-->
      <div class="box-1">box</div>
      <!--scale effect-->
      <div class="box-scale">box2</div>
      <!--translate effect-->
      <div class="box-translate">box3</div>
      <!--skew effect-->
      <div class="box-skew">box4</div>
      <!--gabungan-->
      <div class="gabungan">box5</div>
    </div>
  </body>
</html>
