<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>psuedo</title>
  </head>
  <body>
    <style>
      a:hover {
        color: red;
      }
      p::first-letter {
        font-size: 200%;
        color: blue;
      }
      .btn {
        background-color: green;
        color: white;
        padding: 10px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        font-family: sans-serif;
        font-weight: 900;
      }
      /*membesar halus*/
      .btn:hover {
        background-color: greenyellow;
        color: black;
      }
      .card {
        width: 120px;
        height: 120px;
        background: yellow;
        display: grid;
        place-items: center;
        border-radius: 12px;
        transition: transform 0.25s ease-out;
      }
      .card:hover {
        transform: scale(1.07);
      }
      /*contoh transition 3*/
      .box {
        width: 120px;
        height: 120px;
        background: orange;
        transition: margin-left 1s linear;
      }
      .box.ease {
        transition-timing-function: ease;
      }
      .box.easein {
        transition-timing-function: ease-in;
      }
      .box.easeout {
        transition-timing-function: ease-out;
      }
      .box:hover {
        margin-left: 120px;
      }
      .jalan {
        position: relative;
        animation: geser 2s ease-in-out infinite alternate;
      }
      @keyframes geser {
        from {
          left: 0px;
          opacity: 0.4s;
        }
        to {
          left: 1500px;
          opacity: 1;
        }
      }
      .pulse {
        background-color: purple;
        color: white;
        padding: 10px 18px;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        font-family: sans-serif;
        font-weight: 900;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(255, 111, 97, 0);
        }
        50% {
          transform: scale(1.06);
          box-shadow: 0 0 0 0 rgba(255, 111, 97, 0);
        }
        100% {
          transform: scale(1);
        }
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #eee;
        border-top-color: #42a5f5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .kartu {
        width: 160px;
        height: 120px;
        display: grid;
        place-items: center;
        background-color: #fff3cd;
        border-radius: 16px;
        box-shadow: 0 0 0 rgba (255, 193, 7, 0);
        transition: tranform 0.25s, box-shadow 0.25s ease;
      }
      .kartu:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 20px rgba (255, 193, 7, 45);
      }
      .badge {
        background-color: #00c853;
        color: #fff;
        padding: 4px 10px;
        border-radius: 999px;
        font: 600 12px/1.2 system-ui;
        animation: pop 1.1s ease-out infinite alternate;
      }
      @keyframes pop {
        from {
          transform: scale(1);
          filter: brightness(1);
        }
        to {
          transform: scale(1.12);
          filter: brightness(1.2);
        }
      }
    </style>
    <a href="#">ini link</a>
    <p>ini paragraf</p>
    <button class="btn">arahkan kursor ke sini</button>
    <!--membesar halus saat hover-->
    <div class="card">kartu</div>
    <div class="box ease">box</div>
    <div class="box easein">box</div>
    <div class="box easeout">box</div>
    <!--contoh animation berjalan-->
    <h2 class="jalan">halo guys nama aku vittorio</h2>
    <!--pulse-->
    <button class="pulse">mulai</button>
    <div class="spinner"></div>
    <!--cars glow-->
    <div class="kartu">css fun</div>
    <!---NEW ANIMATION-->
    <span class="badge">NEW</span>
  </body>
</html>
